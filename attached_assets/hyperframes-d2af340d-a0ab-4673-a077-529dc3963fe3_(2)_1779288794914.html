    .clip { position: absolute; }

    .orb-magenta { width: 900px; height: 900px; background: var(--magenta); right: -300px; bottom: 10%; }

    /* --- HUD ELEMENTS (Heads Up Display) --- */
    .hud-corner { width: 80px; height: 80px; border: 4px solid var(--cyan); opacity: 0.6; }

    }
    
    .mega-text.outline {
      -webkit-text-stroke: 4px var(--cyan);
      color: transparent;

      font-size: 170px;
    }

    .sub-tech {
      font-size: 40px;

    }

    .highlight-yellow { color: var(--yellow); text-shadow: 0 0 40px rgba(230, 255, 0, 0.6); }

    .glass-panel {

      border-radius: 40px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .panel-line {

    }

    /* Scene 4 Button */
    .cta-button {
      width: 700px;

    }

    .pos-55 { top: 55%; }
    .pos-60 { top: 60%; }
    .pos-70 { top: 70%; }
    .pos-80 { top: 80%; }
  </style>
</head>
